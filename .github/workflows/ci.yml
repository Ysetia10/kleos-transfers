name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Rapid successive pushes were piling jobs in the queue; older Backend jobs sat
# queued for ~15 minutes and were then cancelled (showing as CI failures).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Pre-pull PostgreSQL image
        # Avoid burning the Gradle test step on a cold Docker Hub pull.
        run: docker pull postgres:16-alpine
        working-directory: .
      - name: Run backend tests
        # Integration tests use Testcontainers PostgreSQL (Docker available on runners).
        # Daemon is recommended with setup-gradle caching; --no-daemon slows cold CI.
        run: ./gradlew test
      - name: Ensure integration tests executed
        # Locally AbstractPostgresIntegrationTest skips when Docker is down; CI must not.
        run: |
          python3 <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          suites = sorted(glob.glob("build/test-results/test/*IntegrationTest.xml"))
          if not suites:
              print("No *IntegrationTest.xml results found", file=sys.stderr)
              sys.exit(1)

          problems = []
          for path in suites:
              root = ET.parse(path).getroot()
              name = root.attrib.get("name", path)
              tests = int(root.attrib.get("tests", 0))
              skipped = int(root.attrib.get("skipped", 0))
              if tests == 0 or skipped == tests:
                  problems.append(f"{name}: tests={tests} skipped={skipped}")

          if problems:
              print("Integration tests did not run against PostgreSQL:", file=sys.stderr)
              print("\n".join(problems), file=sys.stderr)
              sys.exit(1)

          print(f"OK: {len(suites)} integration suites executed")
          PY

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, lint, and production-like build
        run: |
          # Build with the real production API URL so the bundle cannot embed localhost.
          VITE_API_BASE_URL=https://kleos-transfers-api.onrender.com npm run build
          npm run lint
      - name: Guard against localhost API URL in production bundle
        run: |
          set -euo pipefail
          if grep -R --fixed-strings 'localhost:8080' dist/assets; then
            echo "Production bundle must not contain localhost:8080" >&2
            exit 1
          fi
          echo "OK: no localhost:8080 in dist/assets"
