# Datasource URL/user/password/driver are supplied by Testcontainers
# (see AbstractPostgresIntegrationTest). These defaults are placeholders only.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/kleos_transfers_test
    username: kleos
    password: kleos
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

kleos:
  application:
    name: Kleos Transfers
    version: 0.1.0
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
