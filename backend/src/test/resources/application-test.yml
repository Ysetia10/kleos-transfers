spring:
  datasource:
    url: jdbc:h2:mem:kleos_transfers;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

kleos:
  application:
    name: Kleos Transfers
    version: 0.1.0
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
