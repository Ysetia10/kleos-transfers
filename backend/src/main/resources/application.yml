server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: kleos-transfers
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kleos_transfers}
    username: ${DATABASE_USERNAME:kleos}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        # Batched inserts keep bulk identity imports to a few round trips.
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: Kleos Transfers
    version: 0.1.0

kleos:
  application:
    name: Kleos Transfers
    version: 0.1.0
  cors:
    # Include both localhost and 127.0.0.1 — browsers treat them as distinct origins.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
