# Active when SPRING_PROFILES_ACTIVE=prod (Render, etc.)

server:
  # Render injects PORT; fall back to SERVER_PORT then 8080.
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  main:
    # Defer non-critical beans until first use — cuts cold-start time on free-tier CPU.
    lazy-initialization: true
  flyway:
    # Schema is migrated via deploy/restore; skip ~3s pooler round-trips on every boot.
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  jpa:
    show-sql: false
    hibernate:
      # validate hits Supabase for every table (~90s on Render free tier); Flyway owns schema.
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: false
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred

logging:
  level:
    root: INFO
    com.kleos.transfers: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

kleos:
  write-protection:
    # Public prod API: reads + POST /predictions only. Ingest/CRUD/bulk need KLEOS_INGEST_API_KEY.
    enabled: true
    api-key: ${KLEOS_INGEST_API_KEY:}
