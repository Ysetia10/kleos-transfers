# Keep Render free tier awake and smoke-check production health.
# Failures notify via GitHub Actions (email/watch notifications for the repo).
name: Production ops

on:
  schedule:
    # ~every 12 minutes — under Render’s ~15 min idle spin-down window
    - cron: '*/12 * * * *'
  workflow_dispatch:

concurrency:
  group: prod-ops
  cancel-in-progress: false

jobs:
  keep-warm-and-uptime:
    name: Keep-warm + uptime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health (keep-warm)
        # Long timeout: first hit after idle may cold-start ~30–60s.
        run: |
          set -euo pipefail
          API="${PROD_API_BASE:-https://kleos-transfers-api.onrender.com}"
          echo "GET ${API}/api/v1/health"
          curl -fsS --retry 2 --retry-delay 5 --max-time 90 \
            "${API}/api/v1/health" | tee /tmp/health.json
          grep -q '"status":"UP"' /tmp/health.json

      - name: Clubs smoke read
        run: |
          set -euo pipefail
          API="${PROD_API_BASE:-https://kleos-transfers-api.onrender.com}"
          echo "GET ${API}/api/v1/clubs?size=1"
          curl -fsS --max-time 30 \
            "${API}/api/v1/clubs?size=1" | tee /tmp/clubs.json
          grep -q '"content"' /tmp/clubs.json

      - name: Frontend reachable
        run: |
          set -euo pipefail
          UI="${PROD_UI_BASE:-https://kleos-transfer.vercel.app}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${UI}/")
          echo "UI HTTP ${code}"
          test "${code}" = "200"
