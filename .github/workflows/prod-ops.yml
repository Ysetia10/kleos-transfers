# Keep Render awake (every 10 min) + hourly full smoke checks.
name: Production ops

on:
  schedule:
    # Health ping every 10 min — under Render’s ~15 min idle window.
    - cron: '*/10 * * * *'
    # Full smoke at the top of each hour (also runs the health ping).
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: prod-ops
  cancel-in-progress: false

jobs:
  ping:
    name: Keep-warm ping
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Health
        run: |
          set -euo pipefail
          API="${PROD_API_BASE:-https://kleos-transfers-api.onrender.com}"
          echo "GET ${API}/api/v1/health"
          curl -fsS --max-time 240 "${API}/api/v1/health" | tee /tmp/health.json
          grep -q '"status":"UP"' /tmp/health.json

  smoke:
    name: Uptime smoke
    needs: ping
    if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Clubs smoke read
        run: |
          set -euo pipefail
          API="${PROD_API_BASE:-https://kleos-transfers-api.onrender.com}"
          echo "GET ${API}/api/v1/clubs?size=1"
          curl -fsS --max-time 60 \
            "${API}/api/v1/clubs?size=1" | tee /tmp/clubs.json
          grep -q '"content"' /tmp/clubs.json

      - name: Frontend reachable
        run: |
          set -euo pipefail
          UI="${PROD_UI_BASE:-https://kleos-transfer.vercel.app}"
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${UI}/" || echo "000")
            echo "UI HTTP ${code} (attempt ${i})"
            if [ "${code}" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Frontend did not return HTTP 200" >&2
          exit 1
