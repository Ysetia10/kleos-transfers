# Render Blueprint — Spring Boot API + external Supabase Postgres
# Docs: docs/deployment.md
#
# After connect: set secrets in Render dashboard (never commit):
#   DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD, CORS_ALLOWED_ORIGINS, KLEOS_INGEST_API_KEY
#
# Supabase: use Session pooler host (IPv4), not db.<ref>.supabase.co (often IPv6-only).
#   DATABASE_URL=jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
#   DATABASE_USERNAME=postgres.<project-ref>

services:
  - type: web
    name: kleos-transfers-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_FLYWAY_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: KLEOS_INGEST_API_KEY
        sync: false
