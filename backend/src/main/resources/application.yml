server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: kleos-transfers
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kleos_transfers}
    username: ${DATABASE_USERNAME:kleos}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: Kleos Transfers
    version: 0.1.0

kleos:
  application:
    name: Kleos Transfers
    version: 0.1.0
